services:
  mongodb:
    image: mongo:7.0
    container_name: platform-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-axion}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - platform-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: platform-api
    ports:
      - "8000:8000"
    env_file:
      - apps/api/.env
    environment:
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-example}@mongodb:27017/${MONGO_INITDB_DATABASE:-axion}?authSource=admin
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - platform-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_ZXZpZGVudC1hYXJkdmFyay0zMi5jbGVyay5hY2NvdW50cy5kZXYk}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: platform-web
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
