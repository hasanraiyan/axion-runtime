services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: platform-api-dev
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app:ro
    env_file:
      - apps/api/.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - platform-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: platform-web-dev
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.local
    depends_on:
      - api
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge
